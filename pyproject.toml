[project]
name = "warehouse"
version = "0.1.0"
description = "Binance market-data ingestion into Postgres (Milestone A1)"
authors = [
    { name = "Ho Wei An", email = "weian12353@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
warehouse = "warehouse.cli:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"
